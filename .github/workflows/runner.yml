# Runs the runner's tests. Releasing the runner is by hand (runner/README.md), so this
# needs no AWS credentials.

name: Runner

on:
  push:
    paths:
      - "runner/**"
      - "fixtures/**"
      - ".github/workflows/runner.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test the runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm test
